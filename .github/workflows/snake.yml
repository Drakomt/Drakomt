name: Contribution Route

# Regenerates the contribution-snake SVG in dist/, wraps it in the profile's
# dark route card, and commits it back to the default branch. The README ships with a
# pre-framed placeholder at the same path, so it renders correctly even before this
# workflow has ever run.

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:

concurrency:
  group: contribution-route
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution route
        uses: Platane/snk@v3
        with:
          github_user_name: Drakomt
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff5a30&color_dots=#1c2129,#3a1a10,#7a2f14,#c2461f,#ff5a30

      - name: Frame the route panel
        run: |
          python3 - <<'PY'
          import re, pathlib

          PAD, TOP, BOT = 20, 54, 18
          MONO = 'ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace'
          THEME = {
              "dark":  dict(hair="#ffffff", hop="0.10", gop="0.035", bg="#08090b",
                            fg="#f4f4f5", ghost="#4b5563", acc="#ff5a30"),
          }

          def frame(path, theme):
              t = THEME[theme]
              p = pathlib.Path(path)
              raw = p.read_text(encoding="utf-8")
              if 'id="rt-clip"' in raw:
                  print("already framed:", path)
                  return
              s = re.sub(r"<\?xml[^>]*\?>", "", raw).strip()
              tag = re.search(r"<svg\b[^>]*>", s).group(0)
              vb = re.search(r"viewBox=['\"]\s*([-\d.]+)[ ,]+([-\d.]+)[ ,]+([-\d.]+)[ ,]+([-\d.]+)", tag)
              iw, ih = float(vb.group(3)), float(vb.group(4))
              inner = re.sub(r"\s(?:width|height|x|y)=['\"][^'\"]*['\"]", "", tag)
              inner = inner.replace("<svg", '<svg x="%d" y="%d" width="%s" height="%s"' % (PAD, TOP, iw, ih), 1)
              body = s.replace(tag, inner, 1)
              pw, ph = int(iw) + PAD * 2, TOP + int(ih) + BOT
              out = "\n".join([
                  '<?xml version="1.0" encoding="UTF-8"?>',
                  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 %d %d" width="%d" height="%d" role="img" '
                  'aria-label="Contribution route for Drakomt: a year of commit activity drawn as a trail.">'
                  % (pw, ph, pw, ph),
                  '  <title>Contribution Route</title>',
                  '  <defs>',
                  '    <pattern id="rt-grid" width="40" height="40" patternUnits="userSpaceOnUse">',
                  '      <path d="M40 0H0V40" fill="none" stroke="%s" stroke-opacity="%s" stroke-width="1"/>'
                  % (t["hair"], t["gop"]),
                  '    </pattern>',
                  '    <clipPath id="rt-clip"><rect x="0.5" y="0.5" width="%d" height="%d" rx="16"/></clipPath>'
                  % (pw - 1, ph - 1),
                  '    <style>.rtm { font-family: %s; }</style>' % MONO,
                  '  </defs>',
                  '  <g clip-path="url(#rt-clip)">',
                  '    <rect width="%d" height="%d" fill="%s"/>' % (pw, ph, t["bg"]),
                  '    <rect width="%d" height="%d" fill="url(#rt-grid)"/>' % (pw, ph),
                  '    <rect x="%d" y="20" width="3" height="14" rx="1.5" fill="%s"/>' % (PAD + 2, t["acc"]),
                  '    <text class="rtm" x="%d" y="32" font-size="12" letter-spacing="3.2" fill="%s">'
                  'CONTRIBUTION ROUTE</text>' % (PAD + 16, t["fg"]),
                  '    <text class="rtm" x="%d" y="32" font-size="11" letter-spacing="2" text-anchor="end" '
                  'fill="%s">COMMIT SIGNAL</text>' % (pw - PAD - 2, t["ghost"]),
                  '    <line x1="%d" y1="43" x2="%d" y2="43" stroke="%s" stroke-opacity="0.07"/>'
                  % (PAD + 2, pw - PAD - 2, t["hair"]),
                  body,
                  '  </g>',
                  '  <rect x="0.5" y="0.5" width="%d" height="%d" rx="16" fill="none" stroke="%s" '
                  'stroke-opacity="%s"/>' % (pw - 1, ph - 1, t["hair"], t["hop"]),
                  '</svg>',
                  '',
              ])
              p.write_text(out, encoding="utf-8")
              print("framed %s -> %dx%d" % (path, pw, ph))

          frame("dist/github-snake-dark.svg", "dark")

          # fail loudly rather than committing anything malformed
          import xml.dom.minidom as md
          md.parse("dist/github-snake-dark.svg")
          print("route panel parses clean")
          PY

      - name: Commit output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "chore: update contribution route [skip ci]"
          git push
