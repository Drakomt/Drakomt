<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Field route to software systems. Matthew Tsiplakov, Software Developer and former Tank Commander. Route waypoints: field, crew, code, systems.">
  <title>Matthew Tsiplakov — Field Route to Software Systems</title>

  <defs>
    <clipPath id="panel">
      <rect x="0.5" y="0.5" width="1199" height="339" rx="16"/>
    </clipPath>

    <radialGradient id="ember" cx="0.82" cy="0.12" r="0.72">
      <stop offset="0%" stop-color="#ff5a30" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#ff5a30" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ff5a30" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5a30" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff5a30" stop-opacity="0.85"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <style>
      .disp { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace; }

      .ping { animation: pulse 2.6s ease-in-out infinite; }
      .beam { animation: beam 9s linear infinite; }
      .pkt  { animation: fly  9s linear infinite; }
      .nh   { animation: nodeglow 9s linear infinite; }
      .nm   { animation: nodemark 9s linear infinite; }
      .nl   { animation: nodelbl  9s linear infinite; }

      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

      @keyframes fly {
        0%       { transform: translateX(0);      opacity: 0; }
        3%       { opacity: 1; }
        68%      { transform: translateX(1088px); opacity: 1; }
        75%      { transform: translateX(1088px); opacity: 0; }
        100%     { transform: translateX(0);      opacity: 0; }
      }

      @keyframes beam {
        0%       { stroke-dashoffset: 1088; opacity: 0; }
        3%       { opacity: 1; }
        68%, 73% { stroke-dashoffset: 0; opacity: 1; }
        79%      { stroke-dashoffset: 0; opacity: 0; }
        100%     { stroke-dashoffset: 1088; opacity: 0; }
      }

      @keyframes nodeglow { 0% { opacity: 0; } 3% { opacity: .55; } 15% { opacity: 0; } 100% { opacity: 0; } }
      @keyframes nodemark { 0% { fill: #08090b; } 3% { fill: #ff5a30; } 15% { fill: #08090b; } 100% { fill: #08090b; } }
      @keyframes nodelbl  { 0% { opacity: .62; } 3% { opacity: 1; } 18% { opacity: .62; } 100% { opacity: .62; } }

      @media (prefers-reduced-motion: reduce) {
        .ping, .beam, .pkt, .nh, .nm, .nl { animation: none; }
        .beam { opacity: .5; stroke-dashoffset: 0; }
        .pkt  { opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="1200" height="340" fill="#08090b"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#ember)"/>

    <!-- identity motif: the profile's one static tank silhouette -->
    <g transform="translate(905 96) scale(2.05)" fill="#ff5a30" fill-opacity="0.10">
      <rect x="0" y="42" width="122" height="18" rx="9"/>
      <g fill="#08090b">
        <circle cx="16" cy="51" r="5"/><circle cx="34" cy="51" r="5"/><circle cx="52" cy="51" r="5"/>
        <circle cx="70" cy="51" r="5"/><circle cx="88" cy="51" r="5"/><circle cx="106" cy="51" r="5"/>
      </g>
      <path d="M6 42 L11 26 H104 L118 34 V42 Z"/>
      <path d="M44 26 L49 12 H82 L91 26 Z"/>
      <rect x="89" y="16" width="46" height="5" rx="2.5"/>
      <rect x="58" y="6" width="14" height="7" rx="2"/>
    </g>

    <g transform="translate(922 40)">
      <rect width="232" height="34" rx="17" fill="#12151a" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle class="ping" cx="20" cy="17" r="4.5" fill="#5c8a6b"/>
      <text class="mono" x="36" y="22" font-size="12" letter-spacing="1.6" fill="#9ca3af">OPEN TO SOFTWARE ROLES</text>
    </g>

    <g transform="translate(56 0)">
      <text class="mono" x="0" y="112" font-size="14" letter-spacing="4.4" fill="#ff5a30">FIELD ROUTE → SOFTWARE SYSTEMS</text>
      <text class="disp" x="-2" y="176" font-size="56" font-weight="700" letter-spacing="-1.4" fill="#f4f4f5">Matthew Tsiplakov</text>
      <text class="disp" x="0" y="212" font-size="20" fill="#9ca3af">Software Developer <tspan fill="#ff5a30">·</tspan> Former Tank Commander</text>
    </g>

    <!-- route: a signal packet runs the line and lights each waypoint as it passes -->
    <g>
      <line x1="56" y1="272" x2="1144" y2="272" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2" stroke-linecap="round"/>

      <line class="beam" x1="56" y1="272" x2="1144" y2="272" stroke="#ff5a30" stroke-width="6" stroke-linecap="round"
            stroke-dasharray="1088" stroke-dashoffset="1088" filter="url(#soft)" opacity="0.28"/>
      <line class="beam" x1="56" y1="272" x2="1144" y2="272" stroke="#ff5a30" stroke-width="2" stroke-linecap="round"
            stroke-dasharray="1088" stroke-dashoffset="1088"/>

      <g class="nh" style="animation-delay:0s"><circle cx="56" cy="272" r="13" fill="#ff5a30" filter="url(#soft)" opacity="0"/></g>
      <g class="nh" style="animation-delay:2.002s"><circle cx="412" cy="272" r="13" fill="#ff5a30" filter="url(#soft)" opacity="0"/></g>
      <g class="nh" style="animation-delay:4.005s"><circle cx="768" cy="272" r="13" fill="#ff5a30" filter="url(#soft)" opacity="0"/></g>
      <g class="nh" style="animation-delay:6.12s"><circle cx="1144" cy="272" r="13" fill="#ff5a30" filter="url(#soft)" opacity="0"/></g>

      <g stroke="#ff5a30" stroke-width="2">
        <rect class="nm" style="animation-delay:0s"      x="49"   y="265" width="14" height="14" rx="2" fill="#08090b" transform="rotate(45 56 272)"/>
        <rect class="nm" style="animation-delay:2.002s"  x="405"  y="265" width="14" height="14" rx="2" fill="#08090b" transform="rotate(45 412 272)"/>
        <rect class="nm" style="animation-delay:4.005s"  x="761"  y="265" width="14" height="14" rx="2" fill="#08090b" transform="rotate(45 768 272)"/>
        <rect class="nm" style="animation-delay:6.12s"   x="1137" y="265" width="14" height="14" rx="2" fill="#08090b" transform="rotate(45 1144 272)"/>
      </g>

      <g transform="translate(56 272)">
        <g class="pkt" opacity="0">
          <line x1="-52" y1="0" x2="-6" y2="0" stroke="url(#tail)" stroke-width="2" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="8" fill="#ff5a30" opacity="0.35" filter="url(#soft)"/>
          <rect x="-4.5" y="-4.5" width="9" height="9" rx="1.5" fill="#ff7a4d" transform="rotate(45)"/>
        </g>
      </g>

      <g class="mono" font-size="12" letter-spacing="3" fill="#9ca3af">
        <text class="nl" style="animation-delay:0s"     x="56"   y="302" opacity="0.62">FIELD</text>
        <text class="nl" style="animation-delay:2.002s" x="412"  y="302" opacity="0.62" text-anchor="middle">CREW</text>
        <text class="nl" style="animation-delay:4.005s" x="768"  y="302" opacity="0.62" text-anchor="middle">CODE</text>
        <text class="nl" style="animation-delay:6.12s"  x="1144" y="302" opacity="0.62" text-anchor="end" fill="#ff5a30">SYSTEMS</text>
      </g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="339" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
</svg>
