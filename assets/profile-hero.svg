<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Field route to software systems. Matthew Tsiplakov, Software Developer and former Tank Commander.">
  <title>Matthew Tsiplakov — Field Route to Software Systems</title>

  <defs>
    <clipPath id="panel">
      <rect x="0.5" y="0.5" width="1199" height="339" rx="16"/>
    </clipPath>

    <radialGradient id="ember" cx="0.82" cy="0.12" r="0.72">
      <stop offset="0%" stop-color="#ff5a30" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#ff5a30" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ff5a30" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5a30" stop-opacity="0"/>
      <stop offset="18%" stop-color="#ff5a30" stop-opacity="0.55"/>
      <stop offset="82%" stop-color="#ff5a30" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff5a30" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <style>
      .disp { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace; }
      .signal { animation: travel 9s linear infinite; }
      .ping   { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; }
      @keyframes travel { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1120; } }
      @keyframes pulse  { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .signal, .ping { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="1200" height="340" fill="#08090b"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#ember)"/>

    <!-- faint tank motif -->
    <g transform="translate(905 96) scale(2.05)" fill="#ff5a30" fill-opacity="0.10">
      <rect x="0" y="42" width="122" height="18" rx="9"/>
      <g fill="#08090b">
        <circle cx="16" cy="51" r="5"/><circle cx="34" cy="51" r="5"/><circle cx="52" cy="51" r="5"/>
        <circle cx="70" cy="51" r="5"/><circle cx="88" cy="51" r="5"/><circle cx="106" cy="51" r="5"/>
      </g>
      <path d="M6 42 L11 26 H104 L118 34 V42 Z"/>
      <path d="M44 26 L49 12 H82 L91 26 Z"/>
      <rect x="89" y="16" width="46" height="5" rx="2.5"/>
      <rect x="58" y="6" width="14" height="7" rx="2"/>
    </g>

    <!-- status pill -->
    <g transform="translate(922 40)">
      <rect width="232" height="34" rx="17" fill="#12151a" stroke="#ffffff" stroke-opacity="0.10"/>
      <circle class="ping" cx="20" cy="17" r="4.5" fill="#5c8a6b"/>
      <text class="mono" x="36" y="22" font-size="12" letter-spacing="1.6" fill="#9ca3af">OPEN TO SOFTWARE ROLES</text>
    </g>

    <!-- headline -->
    <g transform="translate(56 0)">
      <text class="mono" x="0" y="112" font-size="14" letter-spacing="4.4" fill="#ff5a30">FIELD ROUTE → SOFTWARE SYSTEMS</text>
      <text class="disp" x="-2" y="176" font-size="56" font-weight="700" letter-spacing="-1.4" fill="#f4f4f5">Matthew Tsiplakov</text>
      <text class="disp" x="0" y="212" font-size="20" fill="#9ca3af">Software Developer <tspan fill="#ff5a30">·</tspan> Former Tank Commander</text>
    </g>

    <!-- route band -->
    <g>
      <line x1="56" y1="272" x2="1144" y2="272" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2" stroke-linecap="round"/>
      <line x1="56" y1="272" x2="1144" y2="272" stroke="url(#fade)" stroke-width="2" stroke-linecap="round"/>
      <line class="signal" x1="56" y1="272" x2="1144" y2="272" stroke="#ff5a30" stroke-width="6" stroke-linecap="round"
            stroke-dasharray="90 998" filter="url(#soft)" opacity="0.55"/>
      <line class="signal" x1="56" y1="272" x2="1144" y2="272" stroke="#ff7a4d" stroke-width="2" stroke-linecap="round"
            stroke-dasharray="90 998"/>

      <g fill="#08090b" stroke="#ff5a30" stroke-width="2">
        <rect x="49" y="265" width="14" height="14" rx="2" transform="rotate(45 56 272)"/>
        <rect x="405" y="265" width="14" height="14" rx="2" transform="rotate(45 412 272)"/>
        <rect x="761" y="265" width="14" height="14" rx="2" transform="rotate(45 768 272)"/>
        <rect x="1137" y="265" width="14" height="14" rx="2" transform="rotate(45 1144 272)"/>
      </g>

      <g class="mono" font-size="12" letter-spacing="3" fill="#9ca3af">
        <text x="56" y="302">FIELD</text>
        <text x="412" y="302" text-anchor="middle">CREW</text>
        <text x="768" y="302" text-anchor="middle">CODE</text>
        <text x="1144" y="302" text-anchor="end" fill="#ff5a30">SYSTEMS</text>
      </g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="339" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
</svg>
