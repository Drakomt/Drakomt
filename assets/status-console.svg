<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 368" width="1200" height="368" role="img" aria-label="Current route and system status. Role: Software Developer. Status: open to software roles. Base: Israel. Study: B.Sc. Computer Science, in progress. Focus: full-stack systems, clean interfaces, practical architecture. Field route: former Tank Commander to Software Developer.">
  <title>Current Route / System Status</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <style>
      .s { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace; }
      .cursor { animation: blink 1.2s steps(1) infinite; }
      .ping   { animation: pulse 2.6s ease-in-out infinite; }
      .dash   { animation: run 6s linear infinite; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes run  { from { stroke-dashoffset: 60; } to { stroke-dashoffset: -692; } }
      @media (prefers-reduced-motion: reduce) { .cursor, .ping, .dash { animation: none; } }
    </style>
  </defs>
  <clipPath id="clip"><rect x="0.5" y="0.5" width="1199" height="367" rx="16"/></clipPath>
