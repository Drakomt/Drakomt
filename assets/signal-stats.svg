<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 60" width="880" height="60" role="img" aria-label="Signal stats for Drakomt: total contributions, current streak and longest streak.">
  <title>Signal Stats</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <style>
      .s { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>
  <clipPath id="clip"><rect x="0.5" y="0.5" width="879" height="59" rx="16"/></clipPath>
  <g clip-path="url(#clip)">
    <rect width="880" height="60" fill="#08090b"/>
    <rect width="880" height="60" fill="url(#grid)"/>
    <rect x="22" y="23" width="3" height="15" rx="1.5" fill="#ff5a30"/>
    <text class="m" x="36" y="36" font-size="12" letter-spacing="3.2" fill="#f4f4f5">SIGNAL STATS</text>
    <text class="m" x="858" y="36" font-size="11" letter-spacing="2" text-anchor="end" fill="#4b5563">@DRAKOMT · LIVE</text>
  </g>
  <rect x="0.5" y="0.5" width="879" height="59" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
</svg>
